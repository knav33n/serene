# Parameter sweep and walk-forward on synthetic data. Generate it first:
#   calm research synth --from 2026-08-03 --to 2026-11-30
strategy: short_straddle
underlying: NIFTY
from: "2026-08-03"
to: "2026-11-30"
capital: 1000000
data_dir: data/synthetic
settlement: last_bar # real data: data/market, for NSE's official closes
costs_file: configs/costs.yaml
report_dir: reports

params:
  entry_minute: 15 # minutes after 09:15
  exit_minute: 360 # 15:15
  stop_pct: 30
  lots: 1

sim:
  slippage_bps: 30
  min_ticks: 2
  max_wait_minutes: 3

margin:
  naked_pct: 12 # of index notional; an estimate, not SPAN

sweep:
  metric: sharpe # sharpe, sortino, calmar or net
  grid:
    entry_minute: [15, 45]
    stop_pct: [20, 30, 50]

walkforward:
  train_days: 40
  test_days: 20
