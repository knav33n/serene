# Fyers history download: serene fyers probe|index|backfill|update|lot
plan: prime # prime or standard: sets the request caps the client stays under
dir: F:/INSIGHTS/fyers # every Fyers file goes here, apart from F:/MARKET_DATA
upstox_dir: data/upstox # read only, for exact lot sizes of expiries it covers
band_pct: 5 # keep strikes this far outside the index's range in the 30 days before expiry
workers: 4 # contracts fetched at once, all under one rate limiter

# Indices are known by name (NIFTY, BANKNIFTY, SENSEX). Any other name is an
# NSE stock, fetched as NSE:<NAME>-EQ.
underlyings: [NIFTY, BANKNIFTY, SENSEX]
# Add stock option underlyings here, e.g. [RELIANCE, HDFCBANK, SBIN]
stocks: []

# Symbol master segments read for live lot sizes.
segments: [NSE_FO, BSE_FO]
