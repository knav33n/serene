# The forward test of pd_break_trail, frozen 2026-11-09: these params must not
# change. Judge it only on days after 2026-11-03. Pass criteria, set before
# any of that data exists: at least 60 trades, net positive at 30 bps
# slippage, profit factor at least 1.2, and not negative at 2x slippage. See
# docs/strategies/pd_break_trail.md.
strategy: pd_break_trail
underlying: NIFTY
from: "2026-11-03" # range day only; trades from 2026-11-04
to: "2027-06-30" # set to the last expiry fetched when judging
capital: 100000
data_dir: data/upstox
settlement: data/market
costs_file: configs/costs.yaml
report_dir: reports

params:
  offset_pct: 1 # strike nearest the previous day's NIFTY low plus 1%
  strike_step: 50
  trail_after: 200 # NIFTY points in favour before trailing; no stop before
  trail: 50 # exit on a NIFTY close this far short of the best close
  last_entry_minute: 345 # 15:00; no entries from then
  exit_minute: 360 # 15:15
  lots: 1
  band_strikes: 40 # strikes recorded each side of spot, for tomorrow's option high

sim:
  slippage_bps: 30
  min_ticks: 2
  max_wait_minutes: 3

margin:
  naked_pct: 12 # only short options use it
