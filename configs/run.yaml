# Backtest on synthetic data. Generate it first:
#   calm research synth --from 2026-08-03 --to 2026-11-30
strategy: short_straddle
underlying: NIFTY
from: "2026-08-03"
to: "2026-11-30"
capital: 1000000
data_dir: data/synthetic
settlement: last_bar # real data: data/market, for NSE's official closes
costs_file: configs/costs.yaml
report_dir: reports

params:
  entry_minute: 15 # minutes after 09:15
  exit_minute: 360 # 15:15
  stop_pct: 30
  lots: 1

sim:
  slippage_bps: 30
  min_ticks: 2
  max_wait_minutes: 3

margin:
  naked_pct: 12 # of index notional; an estimate, not SPAN

# Optional pre-trade limits, applied in backtests as in paper and live. Exits
# are never refused. Leave the block out to check margin only.
# risk:
#   max_daily_loss: 20000 # rupees, net of charges and marked to market
#   max_lots_per_leg: 2
#   max_open_lots: 4
#   max_orders_per_minute: 10
#   max_quote_age_seconds: 120
#   max_limit_away_pct: 20
